name: "Shared Master Workflow"

on:
  push:
    branches: ["master", "development"]
  pull_request:
    branches: [ "master", "development" ]
  workflow_dispatch:

jobs:
  master-workflow:
    uses: EyeSeeTea/github-workflows/.github/workflows/master.yml@feature/reusable-workflows
    permissions:
      security-events: write  # Required for CodeQL
      contents: read
    secrets: inherit
    with:
      workflows_to_run: codeql-scan