ServerRoot "/usr/local/apache2"
Listen 3000

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dir_module modules/mod_dir.so

ServerName localhost
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common

# -------------------------------------------------------------------
# CORS and auth headers (mirrors production)
# -------------------------------------------------------------------
Header set Access-Control-Allow-Origin "*"

# -------------------------------------------------------------------
# Proxy targets
#   SPA dev server:   localhost:8081
#   Astro dev server: localhost:4321
#   DHIS2 backend:    configured via DHIS2_BASE_URL env var (optional)
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# 1. Astro assets — built output (/_astro/*) and public/ directories
# -------------------------------------------------------------------
ProxyPass "/_astro/" "http://localhost:4321/_astro/"
ProxyPassReverse "/_astro/" "http://localhost:4321/_astro/"

ProxyPass "/fonts/" "http://localhost:4321/fonts/"
ProxyPassReverse "/fonts/" "http://localhost:4321/fonts/"

ProxyPass "/images/" "http://localhost:4321/images/"
ProxyPassReverse "/images/" "http://localhost:4321/images/"

ProxyPass "/assets/" "http://localhost:4321/assets/"
ProxyPassReverse "/assets/" "http://localhost:4321/assets/"

# -------------------------------------------------------------------
# 2. Astro pages — add paths here as pages migrate to Astro
# -------------------------------------------------------------------
ProxyPass "/about" "http://localhost:4321/about"
ProxyPassReverse "/about" "http://localhost:4321/about"

ProxyPass "/methods" "http://localhost:4321/methods"
ProxyPassReverse "/methods" "http://localhost:4321/methods"

# -------------------------------------------------------------------
# 3. API proxy to DHIS2 backend (same pattern as setupProxy.js)
#    When using the proxy, set DHIS2_BASE_URL in docker-compose.yml
# -------------------------------------------------------------------
# ProxyPass "/dhis2/" "${DHIS2_BASE_URL}/"
# ProxyPassReverse "/dhis2/" "${DHIS2_BASE_URL}/"

# -------------------------------------------------------------------
# 4. SPA — everything else goes to the SPA dev server
# -------------------------------------------------------------------
ProxyPass "/" "http://localhost:8081/"
ProxyPassReverse "/" "http://localhost:8081/"
